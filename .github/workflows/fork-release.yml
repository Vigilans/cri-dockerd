name: Fork Release (Dev Branch)

on:
  # 手动触发，需要用户输入版本信息
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g., v0.3.15-dev)'
        required: true
        default: 'dev-latest'
      version:
        description: 'Build version (e.g., 0.3.15-dev). If empty, uses tag_name without v prefix'
        required: false
        default: ''
      prerelease:
        description: 'Mark as prerelease'
        required: false
        default: true
        type: boolean
  # 当推送 dev-* 格式的tag时自动触发
  push:
    tags:
      - 'dev-*'

permissions:
  contents: write

env:
  GO_VERSION: '1.21'

jobs:
  # 首先确定版本号，供所有构建job使用
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
    - name: Determine version
      id: version
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          TAG_NAME="${{ github.event.inputs.tag_name }}"
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            # 从tag_name移除v前缀作为version
            VERSION="${TAG_NAME#v}"
          fi
        else
          # 从push的tag获取
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#dev-}"
        fi
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
        echo "📦 Version: ${VERSION}"
        echo "🏷️ Tag: ${TAG_NAME}"

  build-linux:
    needs: [prepare]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        ref: dev
        fetch-depth: 0  # 获取完整历史以支持git describe
        fetch-tags: true

    - name: Set up Go ${{ env.GO_VERSION }}
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Build Linux Static
      env:
        VERSION: ${{ needs.prepare.outputs.version }}
      run: |
        echo "Building with VERSION=${VERSION}"
        make static-linux

    - name: Upload Linux Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: cri-dockerd.linux
        retention-days: 5
        path: |
          packaging/static/**/**/**/*.tgz

  build-deb:
    needs: [prepare]
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
    - uses: actions/checkout@v3
      with:
        ref: dev
        fetch-depth: 0
        fetch-tags: true

    - name: Set up Go ${{ env.GO_VERSION }}
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Build DEB
      env:
        VERSION: ${{ needs.prepare.outputs.version }}
      run: |
        echo "Building DEB with VERSION=${VERSION}"
        make ARCH=${{ matrix.arch }} deb

    - name: Upload DEB Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: cri-dockerd.deb-${{ matrix.arch }}
        retention-days: 5
        path: |
          packaging/deb/**/**/**/*.deb

  build-rpm:
    needs: [prepare]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        ref: dev
        fetch-depth: 0
        fetch-tags: true

    - name: Set up Go ${{ env.GO_VERSION }}
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Build RPM
      env:
        VERSION: ${{ needs.prepare.outputs.version }}
      run: |
        echo "Building RPM with VERSION=${VERSION}"
        make rpm

    - name: Upload RPM Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: cri-dockerd.rpm
        retention-days: 5
        path: |
          packaging/rpm/**/**/**/*.rpm

  publish:
    needs: [build-linux, build-deb, build-rpm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cri-dockerd.linux
          path: artifacts/
      - uses: actions/download-artifact@v4
        with:
          pattern: cri-dockerd.deb-*
          path: artifacts/
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: cri-dockerd.rpm
          path: artifacts/

      - name: List artifacts
        run: find artifacts -type f

      - name: Determine tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
            echo "prerelease=${{ github.event.inputs.prerelease }}" >> $GITHUB_OUTPUT
          else
            # 从 dev-* tag 触发
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Dev Release ${{ steps.tag.outputs.tag }}"
          body: |
            🚧 **Development Release from dev branch**

            This is an automated release from the `dev` branch of the fork repository.

            **Note:** This is a development/testing build and may not be stable.
          prerelease: ${{ steps.tag.outputs.prerelease == 'true' }}
          files: |
            artifacts/**/*.tgz
            artifacts/**/*.rpm
            artifacts/**/*.deb
          fail_on_unmatched_files: false
